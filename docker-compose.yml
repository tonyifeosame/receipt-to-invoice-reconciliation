

services:
  postgres:
    image: postgres:15-alpine
    container_name: receipt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receipt_reconciliation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - receipt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipt_reconciliation"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receipt-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: receipt_reconciliation
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-me-in-production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - receipt-network
    volumes:
      - ./receipts:/app/receipts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  ocr-engine:
    build:
      context: ./ocr-engine
      dockerfile: Dockerfile
    container_name: receipt-ocr-engine
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: receipt_reconciliation
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - receipt-network
    volumes:
      - ./receipts:/app/receipts

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: receipt-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - receipt-network

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: receipt-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - receipt-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: receipt-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - receipt-network

volumes:
  postgres_data:

networks:
  receipt-network:
    driver: bridge
