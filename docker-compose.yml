

services:
  postgres:
    image: postgres:15-alpine
    container_name: receipt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receipt_reconciliation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Each init script is mounted individually rather than bind-mounting
      # ./database/migrations onto /docker-entrypoint-initdb.d and nesting
      # seed.sql inside it. With the directory bind-mounted, Docker had to
      # materialise the nested mount target on the host, so every `up` left an
      # empty database/migrations/seed.sql behind in the working tree. Mounting
      # the files one by one keeps /docker-entrypoint-initdb.d in the image's own
      # layer, so nothing is written back to the repository.
      #
      # Postgres runs these in glob (lexicographic) order, so the numeric
      # prefixes decide when each one applies. NOTE: a new migration must be
      # added here as well, or it will not run on a fresh database.
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./database/migrations/002_production_features.sql:/docker-entrypoint-initdb.d/002_production_features.sql:ro
      - ./database/migrations/003_job_results.sql:/docker-entrypoint-initdb.d/003_job_results.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/004_seed.sql:ro
    networks:
      - receipt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipt_reconciliation"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Repository root: the backend image also compiles ocr-engine/, which it
      # runs to OCR receipts (see backend/Dockerfile).
      context: .
      dockerfile: backend/Dockerfile
    container_name: receipt-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: receipt_reconciliation
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-me-in-production
      PORT: 8080
      RECEIPTS_DIR: /app/receipts
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - receipt-network
    volumes:
      - ./receipts:/app/receipts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  ocr-engine:
    build:
      context: ./ocr-engine
      dockerfile: Dockerfile
    container_name: receipt-ocr-engine
    # The engine is a batch CLI: it processes the receipts directory and exits 0.
    # "unless-stopped" restarted it immediately every time it finished, leaving
    # the container in a permanent restart loop that reprocessed every receipt
    # and made the service look perpetually unhealthy. It is run on demand, so
    # only restart it when it exits with a failure, and give up after 3 tries.
    restart: on-failure:3
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: receipt_reconciliation
      DB_USER: postgres
      DB_PASSWORD: postgres
      RECEIPTS_DIR: /app/receipts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - receipt-network
    volumes:
      - ./receipts:/app/receipts

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: receipt-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - receipt-network

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: receipt-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - receipt-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: receipt-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - receipt-network

volumes:
  postgres_data:

networks:
  receipt-network:
    driver: bridge
