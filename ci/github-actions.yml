name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run backend tests
        working-directory: ./backend
        run: go test ./...
      - name: Build backend
        working-directory: ./backend
        run: go build ./...
